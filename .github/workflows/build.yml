name: Build
on:
  push:
    branches: [ v15, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --no-daemon --warning-mode none > build.log 2>&1
          echo "EXIT_CODE=$?" >> build.log
      - name: Publish build log to buildlog branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          cp build.log "$RUNNER_TEMP/log/build.log"
          cd "$RUNNER_TEMP/log"
          git init -q
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout -q -b buildlog
          git add build.log
          git commit -qm "build log for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buildlog
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WerPakClient-V15
          path: build/libs/*.jar
      - name: Fail if build failed
        run: "! grep -q '^EXIT_CODE=[1-9]' build.log"
